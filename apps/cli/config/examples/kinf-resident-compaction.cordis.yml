# Opt-in Web preset for a registered local KINF managed listener.
# From the repository root, run:
# pnpm dsh --profile web --patch apps/cli/config/examples/kinf-resident-compaction.cordis.yml --dump-config
# Remove --dump-config to launch, then select the kinf-resident preset for a new session.
# On a customized profile, merge the provider entry into existing llm-pi-ai config.
# Adjust the endpoint, node, instance and budgets to match the registered listener.
- id: llm-pi-ai
  config:
    providers:
      kinf-resident-summary:
        api: openai-completions
        baseURL: &kinf-base http://127.0.0.1:49362/v1
        models:
          - id: chat-qwen-27b-uncensored-exl3-6bpw@local
            requestModel: &kinf-27b chat-qwen-27b-uncensored-exl3-6bpw
            contextWindow: 16380
            maxTokens: 2048
            input: [text]
            residentTransport: true
          - id: chat-qwen-flash-next@local
            requestModel: &kinf-flash chat-qwen-flash-next
            contextWindow: 262144
            maxTokens: 32768
            input: [text]
            residentTransport: true

- insert:
    - id: preset-kinf-resident
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kinf-resident
        plugins:
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic/hybrid'
                config:
                  auto: true
                  maxTokens: 1024
                  summarizationMode: resident-preferred
                  residentGatewayId: local-kinf
                  residentPinnedNodeId: kano-local
                  residentProvider: kinf-resident-summary
                  residentPreferredVariantIds: [qwen27-uncensored-native-mtp, flash-native-mtp]
                  residentObservationRoutes:
                    - id: local-27b
                      nodeId: kano-local
                      nodeName: local
                      instance: default
                      logicalModel: *kinf-27b
                      baseUrl: *kinf-base
                    - id: local-flash
                      nodeId: kano-local
                      nodeName: local
                      instance: default
                      logicalModel: *kinf-flash
                      baseUrl: *kinf-base
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
