# Replay the complete typed readout while retaining model-owned tool admission.
- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: kinf-snapshot
            name: KINF snapshot
            models:
              - id: flash-native-mtp-decision
                contextWindow: 262144
                defaultMaxTokens: 1
                inputModalities: [text]
                nativeTools: false
                inputProjectionPolicy: reject
